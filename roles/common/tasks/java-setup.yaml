- name: install maven
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop: 
  - maven
  - mysql

- name: install mysql python libraries
  ansible.builtin.pip:
    name: "{{ item }}"
    executable: pip3.9
  loop:
  - cryptography
  - PyMySQL

- name: clean package
  ansible.builtin.command: mvn clean package 
  args:
    chdir: /app

- name: move jar file
  ansible.builtin.command: mv target/shipping-1.0.jar shipping.jar 
  args:
    chdir: /app