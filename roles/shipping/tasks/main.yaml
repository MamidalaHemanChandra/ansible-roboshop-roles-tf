- name: app setup 
  ansible.builtin.import_role:
    name: common
    tasks_from: app-setup.yaml

- name: java setup 
  ansible.builtin.import_role:
    name: common
    tasks_from: java-setup.yaml

- name: load products into mysql
  mysql_db:
    name: all
    state: import
    login_host: localhost
    login_user: "{{ login_user }}"
    login_password: "{{ login_password }}"
    target: "{{ item }}"
  loop:
  - /app/db/schema.sql
  - /app/db/app-user.sql
  - /app/db/master-data.sql

- name: system setup 
  ansible.builtin.import_role:
    name: common
    tasks_from: system-setup.yaml